[project]
name = "fitting-room"
version = "0.1.0"
description = "Personal benchmark of models x harnesses on day-to-day repo work, built on Harbor."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.26.0",
    "pydantic>=2.14",
    "typer>=0.16.0",
]

[project.scripts]
fr = "fitting_room.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitting_room"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["spikes", "tasks", "images"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
