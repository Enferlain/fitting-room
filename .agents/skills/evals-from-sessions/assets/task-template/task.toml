schema_version = "1.4"  # Harbor 0.26.0

[task]
name = "fr/REPO-SLUG"
version = "1.0.0"
description = "ONE-LINE DESCRIPTION"

[metadata]
source_session = "SESSION-ID"   # shareable: opaque label, real id only in provenance.md
category = "CATEGORY"
mode = "private"          # or "shareable"
visibility = "private"    # private mode: always "private"; shareable: "public" if publishable
difficulty = "routine"    # or "discovery" (must-be-discovered list not empty)
repo = "REPO"
episode_id = "EPISODE-ID"   # from work/mining/selected.json
start_commit = "SHA"        # repo state at the episode start; fr task materialize reads repo + this
work_type = "WORK-TYPE"     # feature | refactor | bugfix | investigation | explain | design | docs | config_tooling | review
grading = "test"            # test | answer | judge (judge: tests/rubric.md, scored by fr judge)
# gpu_vram_gb = 8          # GPU tasks only; also set [environment] gpus = 1

[verifier]
timeout_sec = 300.0
environment_mode = "shared"  # explicit: Harbor 0.26 task init defaults to "separate"

[agent]
timeout_sec = 3600.0

[environment]
docker_image = "fr-base/cpu:1"
network_mode = "public"   # web is part of the suite; repos with a public upstream need the remote blocked
cpus = 2
memory_mb = 2048
storage_mb = 4096
