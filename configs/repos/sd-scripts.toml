# Snapshot settings for fr task materialize.
# docs_design/models-strategy-trainer/_deprecated/ holds superseded design material and
# generated evidence (1,256 of 3,012 tracked files at 38cdc295, mostly JSON). Excluded
# at the user's request (2026-11-19) so it doesn't flood agents and their tools.
# Tasks that need part of it bring it back with [metadata] snapshot_include.
exclude = [
    "docs_design/models-strategy-trainer/_deprecated/**",
]

# One canonical composite environment for every sd-scripts task (user, 2026-11-20): the
# Python venv plus the repo-level Rust toolchain, crate cache and warmed target for the
# crates listed here (the Pliron candidate; N7 needs it). No task-specific environments.
[benchmark]
kind = "python+rust"
commit = "38cdc295ee7f8cfe10671f8dd94dee4ff886bd35"
python = "3.14.5t"
sync_args = ["--extra", "onnx-gpu", "--all-groups"]
rust = "1.99.1"
rust_manifests = ["docs_design/models-strategy-trainer/pliron_candidate/native/Cargo.toml"]
